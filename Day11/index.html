<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
      body {
        margin: 0;
        padding: 0;
        height: 300vh;
      }
      .box {
        width: 100px;
        height: 100px;
      }
      #black {
        background-color: black;
      }
      #red {
        background-color: red;
      }
      #blue {
        background-color: blue;
    }
      #green {
        background-color: green;
      }
      #yellow {
        background-color: yellow;
      }
    </style>
  </head>
  <body>
    <section class="container">
        <div id="black" class="box">Black Box</div>
        <div id="red" class="box" style="padding: 0">Red Box</div>
        <div id="blue" class="box">Blue Box</div>
        <div id="yellow" class="box">Yellow Box</div>
    </section>
  </body>
</html>
