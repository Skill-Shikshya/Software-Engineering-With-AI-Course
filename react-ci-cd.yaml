name: Deploy to Production

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_PROD_API_URL }}
          VITE_ENV: ${{ secrets.VITE_PROD_ENV }}
          VITE_SUBDOMAIN: ${{ secrets.VITE_PROD_SUBDOMAIN }}

      - name: Deploy to Production
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_PROD_HOST }}
          username: ${{ secrets.SSH_PROD_USER }}
          key: ${{ secrets.SSH_PROD_PRIVATE_KEY }}
          source: "dist/"
          target: "/var/www/chairlyo-prod"
          strip_components: 1

      - name: Reload Nginx
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_PROD_HOST }}
          username: ${{ secrets.SSH_PROD_USER }}
          key: ${{ secrets.SSH_PROD_PRIVATE_KEY }}
          script: systemctl reload nginx
